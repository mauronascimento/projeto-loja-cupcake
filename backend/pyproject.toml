[tool.poetry]
name = "cupcake-backend"
version = "0.1.0"
description = "Cupcake Store backend API"
authors = ["Copilot <copilot@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "0.162.0"
uvicorn = {extras = ["standard"], version = "0.35.0"}
pydantic = "2.10.6"
pydantic-settings = "2.10.1"
sqlalchemy = "2.0.55"
psycopg = {extras = ["binary"], version = "3.3.2"}
alembic = "1.16.4"
argon2-cffi = "23.1.0"
python-multipart = "0.0.20"
httpx = "0.28.1"
python-jose = {extras = ["cryptography"], version = "3.1.0"}
email-validator = "2.2.0"
Pillow = "11.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.2"
pytest-asyncio = "0.25.0"
pytest-cov = "6.1.0"
black = "25.1.0"
isort = "6.0.1"
flake8 = "7.1.2"
mypy = "1.15.0"
pre-commit = "4.3.0"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
files = ["app"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
